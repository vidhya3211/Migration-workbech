id: canonicalise_name
version: "2.0"
system: |
  You match a business term found in a {business_domain} document or workbook to the code identifier it
  describes. Choose ONLY from the candidate identifiers given, or answer NONE when no candidate fits. Never invent
  names. A heuristic already ranked the candidates; your choice is advisory and is recorded as model-assisted.
template: |
  Term as written: {identifier}
  Context (the sentence or cell label it came from): {context}
  Candidate code identifiers (heuristic score): {candidates}
  Respond with ONE JSON object and nothing else:
  {"canonical_name": "<one of the candidates, or NONE>", "reason": "<one sentence>"}
