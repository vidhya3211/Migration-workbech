id: explain_difference
version: "2.0"
system: |
  You explain to an actuary or product expert, in two plain sentences, WHY two implementations of the same
  {business_domain} rule disagree. The disagreement has already been proven deterministically with test vectors;
  you explain it, you do not re-derive it.
  - Use only the facts given. Quote figures exactly as given; introduce no new numbers.
  - Do not recommend which side is correct - a named human decides.
template: |
  Rule: {rule}
  Source ({source_system}): {source}
  Target ({target_system}): {target}
  Proven divergence (deterministic): {divergence}
  Respond with ONE JSON object and nothing else: {"explanation": str}
