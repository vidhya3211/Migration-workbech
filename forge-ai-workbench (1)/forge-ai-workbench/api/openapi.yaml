components:
  schemas:
    DecisionIn:
      properties:
        decision:
          type: string
          title: Decision
        rationale:
          type: string
          maxLength: 4000
          title: Rationale
          default: ''
        certified_expression:
          anyOf:
          - type: string
          - type: 'null'
          title: Certified Expression
      type: object
      required:
      - decision
      title: DecisionIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginIn:
      properties:
        username:
          type: string
          maxLength: 200
          title: Username
        password:
          type: string
          maxLength: 500
          title: Password
      type: object
      required:
      - username
      - password
      title: LoginIn
    ProjectIn:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        business_domain:
          type: string
          title: Business Domain
        source_technologies:
          items:
            type: string
          type: array
          title: Source Technologies
        target_technologies:
          items:
            type: string
          type: array
          title: Target Technologies
        description:
          type: string
          maxLength: 4000
          title: Description
          default: ''
        settings_overrides:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Settings Overrides
        pipeline:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Pipeline
      type: object
      required:
      - name
      - business_domain
      title: ProjectIn
    ProjectPatch:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Name
        business_domain:
          anyOf:
          - type: string
          - type: 'null'
          title: Business Domain
        source_technologies:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Source Technologies
        target_technologies:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Target Technologies
        description:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Description
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        settings_overrides:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Settings Overrides
        pipeline:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Pipeline
      type: object
      title: ProjectPatch
    QuestionIn:
      properties:
        question:
          type: string
          maxLength: 2000
          title: Question
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
      type: object
      required:
      - question
      title: QuestionIn
    StartRun:
      properties:
        upload_ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Upload Ids
      type: object
      required:
      - upload_ids
      title: StartRun
    UploadIn:
      properties:
        system_name:
          type: string
          maxLength: 200
